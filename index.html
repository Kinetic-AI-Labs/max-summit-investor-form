<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic AI Labs | MAX Summit Investor Feedback</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header / Branding -->
    <header class="w-full max-w-3xl mx-auto pt-8 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                K
            </div>
            <span class="font-bold text-lg tracking-tight text-white">Kinetic AI Labs</span>
        </div>
        <span class="text-xs uppercase tracking-widest bg-indigo-950 text-indigo-300 border border-indigo-800/50 px-3 py-1 rounded-full font-medium">
            MAX Summit 2026
        </span>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl mx-auto px-6 py-8 my-auto">
        
        <!-- Intro Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
                Investor Response & Deck Request
            </h1>
            <p class="mt-3 text-slate-400 text-sm sm:text-base">
                Thank you for attending our pitch at MAX Summit. Let's explore how Kinetic's out-of-process authority plane unblocks autonomous agent compliance.
            </p>
        </div>

        <!-- Feedback Form Card -->
        <div id="form-card" class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            
            <form id="investorForm" action="https://formspree.io/f/xkjjekor" method="POST" class="space-y-6">
                
                <!-- Full Name -->
                <div>
                    <label for="name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Full Name <span class="text-indigo-400">*</span>
                    </label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Sarah Jenkins"
                        class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Work Email <span class="text-indigo-400">*</span>
                    </label>
                    <input type="email" id="email" name="email" required placeholder="sarah@vc-fund.com"
                        class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                </div>

                <!-- Firm / Fund Name -->
                <div>
                    <label for="firm" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Firm / Fund / Angel Network
                    </label>
                    <input type="text" id="firm" name="firm" placeholder="e.g. Horizon Ventures"
                        class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                </div>

                <!-- Investment Stage & Interest -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="stage" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                            Typical Stage
                        </label>
                        <select id="stage" name="stage"
                            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                            <option value="Pre-Seed / Seed">Pre-Seed / Seed</option>
                            <option value="Series A">Series A</option>
                            <option value="Growth / Later">Growth / Later</option>
                            <option value="Angel / Individual">Angel / Individual</option>
                        </select>
                    </div>

                    <div>
                        <label for="timeline" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                            Follow-up Priority
                        </label>
                        <select id="timeline" name="timeline"
                            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm">
                            <option value="High (Call within 24h)">High (Call within 24h)</option>
                            <option value="Standard (Send Deck)">Standard (Send Deck)</option>
                            <option value="Keep Updated (Newsletter)">Keep Updated</option>
                        </select>
                    </div>
                </div>

                <!-- Action Triggers / Checkboxes -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-3">
                        How can we collaborate?
                    </label>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-3 p-3 bg-slate-950/50 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition">
                            <input type="checkbox" name="requested_items[]" value="Full Pitch Deck & Financial Model" checked
                                class="h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-950 border-slate-700">
                            <span class="text-sm text-slate-200">Send Full Deck & Financial Model</span>
                        </label>
                        <label class="flex items-center space-x-3 p-3 bg-slate-950/50 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition">
                            <input type="checkbox" name="requested_items[]" value="Schedule Founder Intro Call"
                                class="h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-950 border-slate-700">
                            <span class="text-sm text-slate-200">Schedule 1-on-1 Founder Call</span>
                        </label>
                        <label class="flex items-center space-x-3 p-3 bg-slate-950/50 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition">
                            <input type="checkbox" name="requested_items[]" value="Private Engine / Live Demo Access"
                                class="h-4 w-4 rounded text-indigo-600 focus:ring-indigo-500 bg-slate-950 border-slate-
